<!-- @format -->

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reel Script Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body
    class="bg-gradient-to-br from-slate-950 via-slate-900 to-indigo-950 text-slate-100 min-h-screen"
  >
    <main class="max-w-2xl mx-auto px-6 py-16">
      <header class="mb-12 border-b border-slate-800 pb-6">
        <h1
          class="text-4xl font-bold tracking-tight bg-gradient-to-r from-indigo-400 to-pink-400 bg-clip-text text-transparent"
        >
          Reel Script Generator
        </h1>
        <p class="text-slate-400 mt-2">Hinglish science reels, on demand. 🎬</p>
      </header>

      <section
        class="mb-8 bg-amber-500/10 border border-amber-500/30 rounded-xl p-4"
      >
        <label
          for="api-key"
          class="block text-sm font-medium text-amber-300 mb-2"
        >
          🔑 Your Gemini API Key
        </label>
        <input
          type="password"
          id="api-key"
          placeholder="Paste your free Gemini API key here..."
          class="w-full rounded-lg bg-slate-900/60 border border-slate-800 p-3 text-sm placeholder-slate-500 focus:outline-none focus:border-amber-500 transition"
        />
        <p class="text-xs text-slate-400 mt-2">
          Get a free key at
          <a
            href="https://aistudio.google.com/apikey"
            target="_blank"
            class="text-amber-300 hover:underline"
            >aistudio.google.com</a
          >. Stored only in your browser.
        </p>
      </section>

      <section class="space-y-4">
        <label for="topic" class="block text-sm font-medium text-slate-400 mb-2"
          >Topic</label
        >
        <textarea
          id="topic"
          rows="3"
          placeholder="e.g. why we never actually touch anything"
          class="w-full rounded-xl bg-slate-900/60 border border-slate-800 p-4 placeholder-slate-500 focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 transition"
        ></textarea>

        <button
          id="generate"
          class="w-full bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 disabled:opacity-50 disabled:cursor-not-allowed transition rounded-xl py-3 font-medium shadow-lg shadow-indigo-500/20"
        >
          Generate script
        </button>
      </section>

      <section
        id="output"
        class="mt-8 whitespace-pre-wrap text-slate-300 bg-slate-900/40 border border-slate-800 rounded-xl p-6 min-h-[120px] empty:hidden"
      ></section>

      <section class="mt-10">
        <button
          id="new-script"
          class="text-sm text-indigo-400 hover:text-indigo-300 mb-4 inline-flex items-center gap-1 transition"
        >
          + New script
        </button>
        <h2 class="text-xl font-semibold mb-4 text-slate-300">
          Past generations
        </h2>
        <div id="history" class="space-y-2"></div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
